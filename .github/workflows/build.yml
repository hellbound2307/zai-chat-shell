name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 9.1.1 hard-requires Gradle >= 9.3.1 (enforced by
          # com.android.internal.version-check).
          gradle-version: '9.3.1'

      # android-actions/setup-android@v3 fails on current runners: it calls
      # `sdkmanager tools`, and the legacy "tools" package was removed from
      # Google's SDK repository ("Failed to find package 'tools'").
      # ubuntu-latest already ships a working SDK but does NOT put sdkmanager
      # on PATH, so resolve it from the SDK root.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK: $SDK"
          # NOTE: under `set -e` a failing command substitution aborts the whole
          # step, so the find is guarded with `|| true`.
          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)
          if [ -z "$SDKM" ]; then
            echo "sdkmanager not found; installing cmdline-tools"
            SDKM_TMP=$(mktemp -d)
            curl -fsSL -o "$SDKM_TMP/ct.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
            unzip -q "$SDKM_TMP/ct.zip" -d "$SDKM_TMP"
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r "$SDKM_TMP/cmdline-tools/." "$SDK/cmdline-tools/latest/"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          # The runner SDK is not owned by the runner user; sdkmanager is already
          # executable, and chmod on it fails with "Operation not permitted".
          chmod +x "$SDKM" 2>/dev/null || true
          echo "SDKMGR=$SDKM" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdkmanager resolved: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

      - name: Install SDK platform 36.1 + build-tools
        run: |
          set -euo pipefail
          "$SDKMGR" --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      # Stable signing identity: generate once, reuse forever via cache.
      # A fresh key per build means every APK is a different app identity and
      # nothing can upgrade-install over the previous one.
      - name: Restore signing keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: zai-debug-keystore-v1

      - name: Generate signing keystore (first run only)
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Write local.properties
        run: echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # The app's classes land in a multidex shard (classes2.dex etc.), NOT
      # necessarily classes.dex. A gate that only reads classes.dex cries wolf.
      - name: Verify launcher activity exists in dex
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "FAIL: no APK produced"; exit 1; }
          echo "APK: $(du -h "$APK" | cut -f1)"
          rm -rf /tmp/dexcheck && mkdir -p /tmp/dexcheck
          unzip -q -o "$APK" 'classes*.dex' -d /tmp/dexcheck
          echo "dex files: $(ls /tmp/dexcheck | tr '\n' ' ')"
          if grep -qa "Lcom/example/MainActivity;" /tmp/dexcheck/*.dex; then
            echo "PASS: launcher class present in dex"
          else
            echo "FAIL: launcher class missing from dex"; exit 1
          fi
          echo "--- confirm the target URL is compiled in ---"
          if grep -qa "https://chat.z.ai" /tmp/dexcheck/*.dex; then
            echo "PASS: chat.z.ai present in dex"
          else
            echo "FAIL: chat.z.ai not found in dex"; exit 1
          fi
          if grep -qa "gemini.google.com" /tmp/dexcheck/*.dex; then
            echo "FAIL: stale gemini.google.com still present"; exit 1
          else
            echo "PASS: no stale gemini.google.com"
          fi
          echo "--- confirm the new applicationId ---"
          if unzip -p "$APK" AndroidManifest.xml | strings | grep -qa "com.hellbound.zai.chat"; then
            echo "PASS: applicationId com.hellbound.zai.chat"
          else
            echo "FAIL: new applicationId not found in manifest"; exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zai-chat-debug
          path: app/build/outputs/apk/debug/app-debug.apk
